<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chefpy HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for a work-from-home team, warm like the Chefpy brand
   IDEA a kitchen pass: people and tasks as tickets on a rail, live status like order states
   PICTURE the live team board, each person with a day timeline of work, break and idle
   COLOUR Chefpy logo: flame orange, charcoal black, white; status green / amber / grey
   TYPE Fredoka (rounded, like the logo lettering) for titles and figures, Inter for text
   LAYOUT sidebar + main on laptop; top scrolling nav and stacked cards on phone */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121110);--panel:light-dark(#fff8f2,#1b1917);--line:light-dark(#f4e3d6,#2d2926);
--ink:light-dark(#1a1714,#f6f0eb);--mute:light-dark(#6b5e55,#b3a79f);
--chili:light-dark(#e05500,#ff7a1a);--onP:light-dark(#ffffff,#1a0c00);--side:light-dark(#161412,#0b0a09);--sideInk:#fff4ec;
--saffron:#ff8a00;--flame:linear-gradient(135deg,#ff8a00,#ff5c00);--work:light-dark(#1f9d55,#3ccf7d);--brk:light-dark(#d18b00,#f2b632);--idle:light-dark(#a3928a,#7c6e67);
--leave:light-dark(#5b6fd1,#8c9cf0);--bad:light-dark(#c62828,#ff6b6b);--chip:light-dark(#fdeee2,#292421)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:Fredoka,Inter,sans-serif;letter-spacing:-.01em;font-weight:600}
h1{font-size:clamp(26px,3vw,34px);line-height:1.1;margin:0}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{white-space:nowrap;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.btn:hover{border-color:var(--chili)}
.btn.p{background:var(--chili);border-color:var(--chili);color:var(--onP)}
.btn.s{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.ok{color:var(--work);border-color:color-mix(in srgb,var(--work) 40%,transparent)}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
input,select,textarea{font-size:16px;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
textarea{min-height:70px}
label{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:500}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;padding:20px 14px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 18px}
.brand .tile{background:#fff;border-radius:14px;padding:4px 6px;display:grid;place-items:center;flex:none}
.brand .tile img{display:block;width:58px;height:auto}
.brand b{font-family:Fredoka,Inter,sans-serif;font-size:20px}
.brand small{display:block;font-size:12px;opacity:.75}
.nav{display:contents}
.nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 12px;border:0;border-radius:10px;background:transparent;color:inherit;text-align:left;font-weight:500}
.nav button:hover{background:rgb(255 255 255/.08)}
.nav button.on{background:#e05500;color:#fff;font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .cnt{margin-left:auto;background:var(--saffron);color:#2a1a00;font-size:12px;font-weight:700;border-radius:20px;padding:0 7px}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgb(255 255 255/.18);display:grid;gap:8px;font-size:13px}
.who .row{display:flex;gap:8px;flex-wrap:wrap}
.who button{flex:1;min-height:36px;border-radius:9px;border:1px solid rgb(255 255 255/.3);background:transparent;color:inherit;font-size:13px}
main{overflow-y:auto;padding:24px clamp(16px,3vw,36px) 48px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--mute)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:13px;color:var(--mute)}
.kpi b{display:block;font-family:Fredoka,Inter,sans-serif;font-size:clamp(22px,2.4vw,28px);line-height:1.2;white-space:nowrap}
.kpi small{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card>.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card>.top h2{margin:0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.p{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.p b{display:block;font-weight:600;line-height:1.2}
.p small{color:var(--mute);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--chip);white-space:nowrap}
.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.c-work{color:var(--work)}.c-break{color:var(--brk)}.c-idle{color:var(--idle)}.c-leave{color:var(--leave)}.c-bad{color:var(--bad)}.c-none{color:var(--mute)}.c-out{color:var(--mute)}
.tl{position:relative;height:14px;border-radius:7px;background:var(--chip);overflow:hidden}
.tl i{position:absolute;top:0;bottom:0}
.tl .work{background:var(--work)}.tl .break{background:var(--brk)}.tl .idle{background:var(--idle)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:3px}
.bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--chili);border-radius:5px}
.bar.g i{background:var(--work)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ticket{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;position:relative}
.ticket:before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:4px;border-radius:0 0 4px 4px;background:var(--line)}
.ticket.work:before{background:var(--work)}.ticket.break:before{background:var(--brk)}.ticket.idle:before{background:var(--idle)}.ticket.leave:before{background:var(--leave)}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px;color:var(--mute)}
.mini b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.col h3{display:flex;justify-content:space-between;padding:2px 4px}
.task{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.task.late{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.task p{margin:0;font-size:13px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);align-items:center}
.pri-High{color:var(--bad)}.pri-Medium{color:var(--brk)}.pri-Low{color:var(--work)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
td .acts{flex-wrap:nowrap}
.clock{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center}
.big{font-family:Fredoka,Inter,sans-serif;font-size:clamp(40px,6vw,64px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stack3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stack3 div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stack3 span{font-size:12px;color:var(--mute)}
.stack3 b{display:block;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cbars{display:flex;align-items:end;gap:6px;height:170px;padding-top:18px}
.cbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.cbars i{width:100%;max-width:34px;background:var(--chili);border-radius:6px 6px 2px 2px;display:block}
.cbars em{font-style:normal;color:var(--ink);font-weight:600;font-size:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .w{grid-column:1/-1}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{width:auto;min-width:150px}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:20px;min-height:34px;padding:4px 14px;font-size:13px;font-weight:600}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:20px;text-align:center;color:var(--mute);font-size:14px}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;font-size:13px;color:var(--mute);margin-top:6px}
.rules b{color:var(--ink)}
.mask{position:fixed;inset:0;background:rgb(20 10 8/.5);display:none;place-items:center;padding:16px;z-index:20}
.mask.on{display:grid}
.modal{background:var(--bg);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;border:1px solid var(--line)}
.modal .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;font-size:18px}
.slip td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.slip tr.t td{font-weight:700;border-top:2px solid var(--ink)}
body.busy,body.busy *{cursor:progress!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90vw}
.toast.on{opacity:1}
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100%}
.lp{background:var(--flame);color:#fff;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:36px}
.lp h1{font-size:clamp(34px,4.4vw,52px);color:#fff}
.lp p{max-width:34em;opacity:.95}
.lp .lg{background:#fff;border-radius:28px;padding:14px 18px;width:min(300px,100%);box-shadow:0 10px 0 rgb(0 0 0/.12)}
.lp .lg img{display:block;width:100%;height:auto}
.lp .tag{font-family:Fredoka,Inter,sans-serif;font-weight:600;font-size:18px;color:#1a1714}

.lf{padding:clamp(28px,5vw,64px);display:grid;align-content:center;gap:18px;max-width:560px}
.acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acc button{display:grid;gap:2px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.acc button.on{border-color:var(--chili);box-shadow:0 0 0 2px color-mix(in srgb,var(--chili) 30%,transparent)}
.acc b{font-size:14px}.acc small{color:var(--mute);font-size:12px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.rzp{background:#161412;color:#fff;border-radius:18px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;border:1px solid #2d2926}
.rzx{font-family:Fredoka,Inter,sans-serif;font-size:17px;color:#fff}
.paybox{margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--work) 12%,transparent);border:1px solid color-mix(in srgb,var(--work) 35%,transparent);font-size:14px}
.paybox small{color:var(--mute)}
.note-row{display:flex;gap:12px;align-items:start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;font-size:14px}
.note-row:last-child{border-bottom:0}
.note-row small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.note-row .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.note-row.unread .dot{background:var(--chili)}.note-row.unread{font-weight:600}
@media(max-width:900px){.g2{grid-template-columns:minmax(0,1fr)}.cols{grid-template-columns:minmax(0,1fr)}.clock{grid-template-columns:minmax(0,1fr)}}
.mtop,.tabs{display:none}
@media(max-width:760px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.side{flex-direction:row;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:10px;overflow:hidden}
.brand{padding:0;flex:none}.brand>div:not(.tile){display:none}.brand .tile img{width:40px}
.side .nav,.side .who{display:none}
.mtop{display:flex;flex:1;align-items:center;justify-content:space-between;gap:8px}
.mtop b{font-family:Fredoka,Inter,sans-serif;font-weight:600;font-size:19px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid rgb(255 255 255/.25);background:transparent;color:#fff;display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.bell i{position:absolute;top:-5px;right:-5px;background:var(--saffron);color:#2a1300;font:700 11px/18px Inter,sans-serif;font-style:normal;min-width:18px;height:18px;border-radius:9px;padding:0 4px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgb(0 0 0/.06)}
.tabs button{display:grid;justify-items:center;gap:2px;border:0;background:none;color:var(--mute);font-size:11px;font-weight:600;min-height:50px;border-radius:12px;padding:4px 2px;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--chili);background:var(--chip)}
.tabs .cnt{position:absolute;top:2px;left:55%;background:var(--saffron);color:#2a1300;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
main{padding:18px 16px 96px}
.toast{bottom:90px}
.login{grid-template-columns:minmax(0,1fr)}.lp .lg{width:200px}
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.more button{display:grid;justify-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;position:relative}
.more button svg{width:24px;height:24px;stroke:var(--chili);fill:none;stroke-width:1.8}
.more button.on{border-color:var(--chili)}
.more .cnt{position:absolute;top:6px;right:8px;background:var(--saffron);color:#2a1300;font-size:11px;font-weight:700;border-radius:9px;padding:0 6px}
}
@media(max-width:600px){
.form{grid-template-columns:minmax(0,1fr)}.acc{grid-template-columns:minmax(0,1fr)}
.stack3{gap:6px}.stack3 div{padding:8px}.stack3 b{font-size:15px}
table{font-size:13px}th,td{padding:7px 5px}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--mute);text-align:left}.stack td.n{white-space:normal}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;const t=c.closest('table');c.dataset.l=(t.tHead&&t.tHead.rows[0].cells[i])?t.tHead.rows[0].cells[i].textContent:''}}).observe(document,{childList:true,subtree:true})</script>

<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let TODAY=new Date(),TK=dkey(TODAY);
const rup=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const hm=m=>{m=Math.max(0,Math.round(m));return Math.floor(m/60)+'h '+pad(m%60)+'m'};
const tm=m=>{if(m==null)return '–';m=Math.round(m);let h=Math.floor(m/60),mm=m%60,ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(mm)+' '+ap};

const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);

const fdate=k=>{const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);return WD[dt.getDay()]+' '+d+' '+MON[m-1]};
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};

const workDaysBetween=(a,b)=>{let n=0;for(let k=a;k<=b;k=addDays(k,1))if(!isSun(k))n++;return n};

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  else if(rec.out==null){const g=rec.segs[rec.segs.length-1];btns=(g.t==='break'?`<button class="btn p" data-a="resume">End break</button>`:`<button class="btn" data-a="brk">Take a break</button>`)+`<button class="btn no" data-a="out">Check out</button>`}
  else btns=`<p class="note">Day closed at ${tm(rec.out)}.</p>`;
  return `<div class="card"><div class="clock"><div><div class="meta" style="margin-bottom:8px">${chip(st)}${rec?`<span>Checked in ${tm(rec.in)}${rec.in>LATE?' · <span class="c-bad">late</span>':''}</span>`:''}</div>
  <div class="big" id="clock">${clockText(rec)}</div><p class="note" style="margin:6px 0 14px">Active time today · shift target 8h</p><div class="acts">${btns}</div></div>
  <div><div class="stack3" style="margin-bottom:12px"><div><span>Active</span><b id="cA">${hm(t.work)}</b></div><div><span>Break</span><b id="cB">${hm(t.break)}</b></div><div><span>Idle</span><b id="cI">${hm(t.idle)}</b></div></div>
  <div id="myTl">${tl(rec)}</div>${ticks}<div style="margin-top:8px">${legend}</div></div></div>
  <p class="note">While you are checked in, 5 minutes without mouse, keyboard or touch activity in this app is recorded as idle time.</p></div>`}
function clockText(rec){const w=tsum(rec).work*60;const s=Math.floor(w);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}

V.me=()=>{const e=me();const cs=callsOn(ME,TK).sort((a,b)=>b.t-a.t);
  return `<div class="head"><div><h1>My day</h1><p>${fdate(TK)} · working from home</p></div></div>${myDayCard()}
  ${e.role==='sales'?`<div class="grid g2" style="margin-top:16px"><div class="card"><h2>Log a call</h2>${callForm()}</div><div class="card"><h2>My calls today (${cs.length})</h2>${callTable(cs,false)}</div></div>`:''}
  <div class="card" style="margin-top:16px"><h2>My tasks</h2><div class="board">${S.tasks.filter(x=>x.to===ME).map(taskCard).join('')||'<div class="empty">No tasks yet</div>'}</div></div>`};

V.live=()=>{const list=scope(),depts=['All',...new Set(list.map(e=>e.dept))],sh=list.filter(e=>UI.dept==='All'||e.dept===UI.dept);
  const c={work:0,break:0,idle:0};sh.forEach(e=>{const k=status(e.id).k;if(c[k]!=null)c[k]++});
  return `<div class="head"><div><h1>Live monitor</h1><p>${c.work} working · ${c.break} on break · ${c.idle} idle · updates every 30 seconds</p></div><div class="filters">${depts.map(d=>`<button class="pill${UI.dept===d?' on':''}" data-a="dept" data-v="${esc(d)}">${esc(d)}</button>`).join('')}</div></div>
  <div style="margin-bottom:14px">${legend}</div><div class="board">${sh.map(liveTicket).join('')}</div>`};

V.attendance=()=>{const r=role(),list=scope(),k=UI.attDate;
  const rows=list.map(e=>{const a=attFor(e.id,k);const l={present:a.late?{k:'break',l:'Late'}:{k:'work',l:'Present'},absent:{k:'bad',l:'Absent'},leave:{k:'leave',l:'On leave'},none:{k:'none',l:k===TK?'Not checked in':'No record'},off:{k:'none',l:'Weekly off'},pre:{k:'none',l:'Before start'}}[a.st];if(a.half)l.l='Half day';
    return `<tr><td>${person(e,e.dept)}</td><td>${chip(l)}</td><td class="n">${tm(a.in)}</td><td class="n">${a.out!=null?tm(a.out):a.in!=null?'working':'–'}</td><td class="n">${a.act!=null?hm(a.act):'–'}</td><td class="n">${a.brk!=null?hm(a.brk):'–'}</td><td class="n">${a.idle!=null?hm(a.idle):'–'}</td>${isAdm()?`<td><div class="acts"><button class="btn s" data-a="dayEdit" data-v="${e.id}">${a.st==='present'?'Edit':'Add'}</button>${a.st==='present'?`<button class="btn s no" data-a="dayDel" data-v="${e.id}">Delete</button>`:''}</div></td>`:''}</tr>`}).join('');
  const first=TK.slice(0,8)+'01',ds=[];for(let x=first;x<=TK;x=addDays(x,1))if(!isSun(x))ds.push(x);
  const sumRows=list.map(e=>{let p=0,l=0,a=0,lv=0,act=0,n=0;ds.forEach(x=>{const z=attFor(e.id,x);if(z.st==='present'){p++;if(z.late)l++;if(z.act!=null){act+=z.act;n++}}else if(z.st==='leave')lv++;else if(x<TK&&z.st!=='pre')a++});
    return `<tr><td>${person(e,'')}</td><td class="n">${p}</td><td class="n">${l}</td><td class="n">${lv}</td><td class="n">${a}</td><td class="n">${n?hm(act/n):'–'}</td></tr>`}).join('');
  return `<div class="head"><div><h1>Attendance</h1><p>${list.length>1?'Daily register and this month’s summary':'Your attendance record'}</p></div><div class="filters"><label>Date<input type="date" id="attDate" value="${k}" max="${TK}" min="${minDay()}" data-c="attDate"></label></div></div>
  <div class="card"><h2>${fdate(k)}</h2><div class="scroll"><table class="stack"><thead><tr><th>Employee</th><th>Status</th><th class="n">In</th><th class="n">Out</th><th class="n">Active</th><th class="n">Break</th><th class="n">Idle</th>${isAdm()?'<th></th>':''}</tr></thead><tbody>${rows}</tbody></table></div><p class="note">Late = check-in after 9:45 am. Half day = less than 4h 30m worked. Shift 9:30 am to 6:30 pm, Monday to Saturday.</p></div>
  <div class="card" style="margin-top:16px"><h2>${MON[TODAY.getMonth()]} so far (${ds.length} working days)</h2><div class="scroll"><table class="stack"><thead><tr><th>Employee</th><th class="n">Present</th><th class="n">Late</th><th class="n">Leave</th><th class="n">Absent</th><th class="n">Avg active</th></tr></thead><tbody>${sumRows}</tbody></table></div></div>`};

function taskCard(t){const late=t.st!=='done'&&t.due<TK,mine=t.to===ME,boss=t.by===ME||['admin','hr'].includes(role()),adm=isAdm();
  const nx={todo:['doing','Start'],doing:['done','Mark done'],done:['doing','Reopen']}[t.st];
  return `<div class="task${late?' late':''}"><div class="meta"><span class="pri-${t.pri}">● ${t.pri}</span><span${late?' class="c-bad"':''}>Due ${fdate(t.due)}${late?' · overdue':''}</span></div><b>${esc(t.title)}</b>${t.desc?`<p>${esc(t.desc)}</p>`:''}
  <div class="meta"><span>To ${esc(emp(t.to).name)}</span><span>by ${esc(emp(t.by).name)}</span></div>${mine||boss?`<div class="acts">${mine||boss?`<button class="btn s" data-a="tst" data-v="${t.id}|${nx[0]}">${nx[1]}</button>`:''}${adm?`<button class="btn s" data-a="task" data-v="${t.id}">Edit</button><button class="btn s no" data-a="tdelAsk" data-v="${t.id}">Delete</button>`:''}</div>`:''}</div>`}
V.tasks=()=>{const r=role(),list=scope(),canAssign=r!=='sales'&&r!=='ops';
  let ts=S.tasks.filter(t=>list.some(e=>e.id===t.to)||t.by===ME);if(UI.taskWho!=='all')ts=ts.filter(t=>t.to===UI.taskWho);

  return `<div class="head"><div><h1>Tasks</h1><p>${ts.filter(t=>t.st!=='done').length} open · ${ts.filter(t=>t.st!=='done'&&t.due<TK).length} overdue</p></div><div class="filters">${list.length>1?`<select data-c="taskWho" aria-label="Filter by person">${empOpts(list,UI.taskWho,1)}</select>`:''}${canAssign?`<button class="btn p" data-a="task" data-v="">Assign a task</button>`:''}</div></div>
  <div class="cols">${col('todo','To do')}${col('doing','In progress')}${col('done','Done')}</div>`};

function leaveRow(l){const e=emp(l.emp),c={pending:'break',approved:'work',rejected:'bad'}[l.st];
  return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">${person(e,`${l.type} · ${fdate(l.from)}${l.to!==l.from?' to '+fdate(l.to):''} · ${lvDays(l)} day${lvDays(l)>1?'s':''}`)}
  <div class="acts">${l.st==='pending'&&canApprove(l)?`<button class="btn s ok" data-a="lv" data-v="${l.id}|approved">Approve</button><button class="btn s no" data-a="lv" data-v="${l.id}|rejected">Reject</button>`:`<span class="chip c-${c}">${l.st[0].toUpperCase()+l.st.slice(1)}</span>`}${isAdm()?`<button class="btn s" data-a="lvEdit" data-v="${l.id}">Edit</button><button class="btn s no" data-a="lvDel" data-v="${l.id}">Delete</button>`:''}</div>
  <div style="flex-basis:100%;font-size:13px;color:var(--mute);padding-left:44px">${esc(l.reason)}${l.by?' · by '+esc(emp(l.by).name):''}</div></div>`}
V.leaves=()=>{const list=scope(),e=me();const ls=S.leaves.filter(l=>list.some(x=>x.id===l.emp)).sort((a,b)=>b.applied.localeCompare(a.applied));
  const pend=ls.filter(l=>l.st==='pending'&&canApprove(l));

  <div class="grid g2"><div class="card"><h2>Apply for leave</h2><div class="stack3" style="margin-bottom:14px">${Object.keys(QUOTA).map(k=>`<div><span>${k} left</span><b>${QUOTA[k]-used(ME,k)} of ${QUOTA[k]}</b></div>`).join('')}</div>
  <form id="fLeave" class="form"><label>Type<select name="type">${Object.keys(QUOTA).map(k=>`<option>${k}</option>`).join('')}</select></label><label>&nbsp;<span class="note" style="margin:0">Approver: ${esc(e.role==='admin'?'none needed':emp(e.mgr||'E02').name)}</span></label>
  <label>From<input type="date" name="from" required min="${TK}" value="${addDays(TK,1)}"></label><label>To<input type="date" name="to" required min="${TK}" value="${addDays(TK,1)}"></label>
  <label class="w">Reason<textarea name="reason" required maxlength="200" placeholder="A short reason for your manager"></textarea></label><div class="w"><button class="btn p">Send request</button></div></form></div>
  <div class="card"><h2>${list.length>1?'All requests':'My requests'}</h2>${ls.length?ls.map(leaveRow).join(''):'<div class="empty">No leave requests yet</div>'}</div></div>`};

function callForm(){return `<form id="fCall" class="form"><label>Customer name<input name="lead" required maxlength="60"></label><label>Phone<input name="phone" required inputmode="tel" maxlength="15"></label>
  <label>Outcome<select name="out">${OUTS.map(o=>`<option>${o}</option>`).join('')}</select></label><label>Call length (minutes)<input name="dur" type="number" min="0" max="120" step="0.5" value="3"></label>
  <label>Booking value (₹, if converted)<input name="rev" type="number" min="0" step="500" value="0"></label><label>Enquiry<select name="note">${NEEDS.map(n=>`<option>${n}</option>`).join('')}</select></label>

function callTable(cs,who){if(!cs.length)return '<div class="empty">No calls logged yet today</div>';
  return `<div class="scroll" style="max-height:420px;overflow-y:auto"><table class="stack"><thead><tr><th class="n">Time</th>${who?'<th>Executive</th>':''}<th>Customer</th><th>Outcome</th><th class="n">Length</th><th class="n">Value</th>${isAdm()?'<th></th>':''}</tr></thead><tbody>${cs.map(c=>`<tr><td class="n">${tm(c.t)}</td>${who?`<td>${esc(emp(c.emp).name)}</td>`:''}<td><b style="font-weight:600">${esc(c.lead)}</b><br><small style="color:var(--mute)">${esc(c.note)}</small></td><td><span class="chip c-${{Connected:'work',Converted:'leave','No answer':'none',Callback:'break'}[c.out]||'none'}">${esc(c.out)}</span></td><td class="n">${c.dur?Math.floor(c.dur/60)+'m '+pad(Math.round(c.dur%60))+'s':'–'}</td><td class="n">${c.rev?rup(c.rev):'–'}</td>${isAdm()?`<td><div class="acts"><button class="btn s" data-a="callEdit" data-v="${c.id}">Edit</button><button class="btn s no" data-a="callDel" data-v="${c.id}">Delete</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
V.sales=()=>{const r=role(),list=scope().filter(e=>e.role==='sales'),boss=r==='admin'||r==='manager';
  const rows=list.map(e=>{const m=monthStats(e.id),t=tgt(e.id),d=dayStats(e.id,TK);return `<tr><td>${person(e,'')}</td><td class="n">${d.calls} / ${Math.round(t.calls/26)}</td><td class="n">${m.calls} / ${t.calls}</td><td class="n">${hm(m.talk)}</td><td class="n">${m.conv} / ${t.conv}</td><td class="n">${rup(m.rev)}</td><td style="min-width:110px">${bar(pct(m.rev,t.rev),pct(m.rev,t.rev)>=100)}<small>${pct(m.rev,t.rev)}% of ${rup(t.rev)}</small></td>${boss?`<td><button class="btn s" data-a="tgt" data-v="${e.id}">Set target</button></td>`:''}</tr>`}).join('');
  const ds=[];for(let k=TK;ds.length<14;k=addDays(k,-1))if(!isSun(k))ds.unshift(k);

  const cd=UI.callDate&&UI.callDate<TK?UI.callDate:TK,past=cd!==TK;if(past&&!UI.dayCalls[cd])fetchCalls(cd);let cs=past?(UI.dayCalls[cd]||[]).filter(c=>list.some(e=>e.id===c.emp)):list.flatMap(e=>callsOn(e.id,TK));if(UI.callWho!=='all')cs=cs.filter(c=>c.emp===UI.callWho);cs.sort((a,b)=>b.t-a.t);
  return `<div class="head"><div><h1>Sales &amp; calls</h1><p>${MON[TODAY.getMonth()]} targets, call counts and talk time</p></div></div>
  <div class="card"><h2>Targets, this month</h2><div class="scroll"><table class="stack"><thead><tr><th>Executive</th><th class="n">Calls today</th><th class="n">Calls month</th><th class="n">Talk time</th><th class="n">Bookings</th><th class="n">Revenue</th><th>Achieved</th>${boss?'<th></th>':''}</tr></thead><tbody>${rows||'<tr><td>No sales executives in view</td></tr>'}</tbody></table></div></div>
  <div class="grid g2" style="margin-top:16px">${r==='sales'?`<div class="card"><h2>Log a call</h2>${callForm()}</div>`:`<div class="card"><h2>Team calls, last 14 working days</h2><div class="cbars">${dc.map(x=>`<div><em>${x.n}</em><i style="height:${x.n/mx*100}%"></i>${fdate(x.k).split(' ')[1]}</div>`).join('')}</div></div>`}
  <div class="card"><div class="top"><h2>Call log ${past?fdate(cd):'today'} (${cs.length})</h2>${list.length>1?`<div class="filters"><input type="date" data-c="callDate" value="${cd}" max="${TK}" min="${minDay()}" style="width:auto" aria-label="Call log date"><select data-c="callWho" style="width:auto" aria-label="Filter calls">${empOpts(list,UI.callWho,1)}</select></div>`:''}</div>${past&&!UI.dayCalls[cd]?'<div class="empty">Loading…</div>':callTable(cs,list.length>1)}</div></div>`};

V.payroll=()=>{const off=UI.payOff,list=S.emps.map(e=>({e,p:pay(e,off)})),P=list[0].p;
  const pend=list.filter(x=>!x.p.po&&x.p.net>0),pendAmt=sum(pend,x=>x.p.net),proc=list.filter(x=>x.p.po&&x.p.po.st==='processing').length;
  const st=p=>p.paid?`<span class="chip c-work">Paid</span>`:p.po?`<span class="chip c-break">Processing</span>`:`<span class="chip c-none">Pending</span>`;
  const hist=S.payouts.slice(0,30);
  return `<div class="head"><div><h1>Payroll</h1><p>${P.label}${P.partial?' · month to date, '+P.elapsed+' of '+P.wd+' working days':' · '+P.wd+' working days'}</p></div><div class="filters"><button class="pill${off===1?' on':''}" data-a="poff" data-v="1">Last month</button><button class="pill${off===0?' on':''}" data-a="poff" data-v="0">This month</button></div></div>
  <div class="rzp"><div><div class="meta" style="color:inherit;opacity:.85"><b class="rzx">RazorpayX</b><span class="chip c-work" style="background:rgb(255 255 255/.12)">Connected</span><span class="chip" style="background:rgb(255 255 255/.12);color:#ffd2ad">Test mode</span></div>
  <div class="num" style="font-size:clamp(28px,3.4vw,40px);line-height:1.1;margin-top:6px">${rup(S.rzp.balance)}</div><small style="opacity:.8">Available balance · ${esc(S.rzp.acct)}</small></div>

  <div class="kpis">${kpi('Gross',rup(sum(list,x=>x.p.gross)),S.emps.length+' employees')}${kpi('Deductions',rup(sum(list,x=>x.p.lop+x.p.lateD+x.p.pf+x.p.pt+x.p.other)),'LOP, late, PF, PT, other')}${kpi('Sales incentive',rup(sum(list,x=>x.p.inc)),S.inc+'% of bookings revenue')}${kpi('Net payable',rup(sum(list,x=>x.p.net)),list.filter(x=>x.p.paid).length+' of '+list.length+' paid')}</div>
  <div class="card"><div class="scroll"><table class="stack"><thead><tr><th>Employee</th><th class="n">Gross</th><th class="n">LOP days</th><th class="n">Late</th><th class="n">Deductions</th><th class="n">Incentive + bonus</th><th class="n">Net pay</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(({e,p})=>`<tr><td>${person(e,e.bank||e.dept)}</td><td class="n">${rup(p.gross)}</td><td class="n">${p.lopDays}</td><td class="n">${p.late}</td><td class="n">${rup(p.lop+p.lateD+p.pf+p.pt+p.other)}</td><td class="n">${p.inc+p.bonus?rup(p.inc+p.bonus):'–'}</td><td class="n"><b>${rup(p.net)}</b></td><td>${st(p)}</td><td><div class="acts"><button class="btn s" data-a="slip" data-v="${e.id}">Payslip</button>${p.po?'':`<button class="btn s" data-a="adj" data-v="${e.id}">Adjust</button><button class="btn s p" data-a="rp" data-v="${e.id}">Pay</button>`}</div></td></tr>`).join('')}</tbody></table></div>
  <div class="rules"><span><b>Loss of pay:</b> gross ÷ working days × (absent days + ½ per half day)</span><span><b>Late marks:</b> every 3 late check-ins = ½ day deducted</span><span><b>PF:</b> 12% of basic (50% of gross), max ₹1,800</span><span><b>Professional tax:</b> ₹200 a month</span><span><b>Approved leave:</b> paid, no deduction</span><span><b>Sales incentive:</b> ${S.inc}% of the month’s booking revenue ${isAdm()?'<button class="btn s" data-a="inc" style="margin-left:4px">Change</button>':''}</span></div></div>
  <div class="card" style="margin-top:16px"><div class="top"><h2>Razorpay payouts</h2><small class="note" style="margin:0">Newest first</small></div><div class="scroll"><table class="stack"><thead><tr><th>Payout</th><th>Employee</th><th>Month</th><th class="n">Amount</th><th>Sent to</th><th>Status</th><th>UTR</th>${isAdm()?'<th></th>':''}</tr></thead><tbody>
  ${hist.map(x=>`<tr><td><code style="font-size:12px">${esc(x.id)}</code><br><small style="color:var(--mute)">${ago(x.at)}</small></td><td>${esc(emp(x.emp).name)}</td><td>${esc(x.label)}</td><td class="n">${rup(x.amt)}</td><td>${esc(x.mode)} · ${esc(x.to)}</td><td><span class="chip c-${x.st==='processed'?'work':'break'}">${x.st==='processed'?'Processed':'Processing'}</span></td><td class="n">${esc(x.utr||'–')}</td>${isAdm()?`<td><button class="btn s no" data-a="poDel" data-v="${esc(x.id)}">Cancel</button></td>`:''}</tr>`).join('')||'<tr><td>No payouts yet</td></tr>'}</tbody></table></div>
  <p class="note">Razorpay test mode: payouts are recorded and marked processed a few seconds later, but no real money moves. Real payouts need your RazorpayX API keys on a server (for example a Supabase Edge Function), because a web page must never hold secret keys.</p></div>`};
V.payslip=()=>{const e=me();return `<div class="head"><div><h1>My payslip</h1><p>Salary, deductions and net pay</p></div><div class="filters"><button class="pill${UI.payOff===0?' on':''}" data-a="poff" data-v="0">This month</button><button class="pill${UI.payOff===1?' on':''}" data-a="poff" data-v="1">Last month</button></div></div><div class="card" style="max-width:620px">${slip(e,pay(e,UI.payOff))}</div>`};
function slip(e,p){const L=(a,b,c)=>`<tr><td>${a}${c?`<br><small style="color:var(--mute)">${c}</small>`:''}</td><td>${b}</td></tr>`;
  return `<div class="meta" style="justify-content:space-between;margin-bottom:10px">${person(e,e.title+' · '+e.id)}<span class="chip c-${p.paid?'work':p.po?'break':'none'}">${p.label} · ${p.paid?'Paid':p.po?'Processing':'Pending'}</span></div>
  <table class="slip"><tbody>${L('Gross salary',rup(p.gross))}${L('Loss of pay','−'+rup(p.lop),`${p.ab} absent, ${p.half} half day · ${p.lopDays} days × ${rup(p.per)}`)}${L('Late-mark deduction','−'+rup(p.lateD),`${p.late} late check-ins · ${p.lateDays} day`)}${L('Provident fund (PF)','−'+rup(p.pf))}${L('Professional tax','−'+rup(p.pt))}
  ${p.inc?L('Sales incentive','+'+rup(p.inc),S.inc+'% of '+rup(p.incBase)+' bookings revenue'):''}${p.adj.map(a=>L(esc(a.reason),(a.amt<0?'−':'+')+rup(Math.abs(a.amt)),a.amt<0?'Other deduction':'Bonus')).join('')}<tr class="t"><td>Net pay</td><td>${rup(p.net)}</td></tr></tbody></table>

  <div><h1>Chefpy HRMS for the whole team, working from home</h1><p>Check-ins, live work status, calls and targets, tasks, leave approvals, payroll with automatic deductions and salary payouts through Razorpay, all connected.</p></div></section>
  <section class="lf"><div><h2 style="font-size:24px">Sign in</h2><p class="note" style="margin:0">Sign in with your employee ID. Everything is saved online, so HR and managers see your check-ins, calls and leave live.</p></div>
  <div class="acc">${acc.map(id=>`<button type="button" class="${UI.acc===id?'on':''}" data-a="acc" data-v="${id}"><b>${SAMPLE[id][0]}</b><small>${esc(SAMPLE[id][1])} · ${id}</small></button>`).join('')}</div>
  <form id="fLogin" class="grid" style="gap:12px"><label>Employee ID<input name="uid" id="lid" value="${esc(a.id)}" autocomplete="username" required></label><label>Password<input name="pw" id="lpw" type="password" value="${esc(a.pw)}" autocomplete="current-password" required></label><div class="err" id="lerr">${esc(UI.lmsg||'')}</div><button class="btn p">Sign in</button></form>
  <p class="note">Starter accounts use admin123, hr123, sales123 and emp123. Change them after your first sign-in (Password, in the menu), and replace the sample staff in Team.</p></section></div>`}

/* ---------- modal + toast ---------- */
const open=(title,html)=>{$('#modal').innerHTML=`<div class="top"><h2 style="margin:0">${title}</h2><button class="x" data-a="close" aria-label="Close">×</button></div>${html}`;$('#mask').classList.add('on');const f=$('#modal input,#modal select,#modal textarea');if(f)f.focus()};
const close=()=>$('#mask').classList.remove('on');
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};

/* ---------- work session ---------- */
let lastAct=Date.now(),autoIdle=false;
const myRec=()=>S.gen.today[ME];
const poke=()=>{lastAct=Date.now();if(autoIdle){autoIdle=false;const rec=myRec();if(rec&&rec.out==null){const g=rec.segs[rec.segs.length-1];const m=g?Math.max(0,Math.round(nowMin()-g.s)):0;sync('hrms_state',T({p_kind:'work',p_at:null}),'Welcome back. '+m+' min recorded as idle.')}}};
['mousemove','keydown','click','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,poke,{passive:true,capture:true}));
function tick(){if(!ME)return;const rec=myRec();
  if(rec&&rec.out==null&&!autoIdle&&Date.now()-lastAct>IDLE_MS){const g=rec.segs[rec.segs.length-1];if(g&&g.t==='work'&&g.e==null){autoIdle=true;const at=Math.max(g.s,nowMin()-(Date.now()-lastAct)/60000);g.e=at;rec.segs.push({t:'idle',s:at,e:null});if(!$('#mask.on'))render();api('hrms_state',T({p_kind:'idle',p_at:new Date(lastAct).toISOString()})).catch(()=>{});return}}
  const c=$('#clock');if(c&&rec){c.textContent=clockText(rec);const t=tsum(rec);$('#cA').textContent=hm(t.work);$('#cB').textContent=hm(t.break);$('#cI').textContent=hm(t.idle)}}
setInterval(tick,1000);
const ping=()=>{const r=ME&&myRec();if(r&&r.out==null)return api('hrms_ping',T({})).catch(()=>{});return Promise.resolve()};
setInterval(()=>{if(!document.hidden)ping()},60000);
const editing=()=>$('#mask.on')||(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('form'));
setInterval(()=>{if(ME&&!BUSY&&!document.hidden)load().then(()=>{if(ME&&!editing())render()}).catch(()=>{})},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden||!ME)return;if(!autoIdle)lastAct=Date.now();ping().then(()=>load()).then(()=>{if(ME&&!editing())render()}).catch(()=>{})});

/* ---------- actions ---------- */
const A={
 go:v=>{UI.view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();const m=$('main');if(m)m.scrollTop=0},
 acc:v=>{UI.acc=v;render()},
 logout:()=>{const t=TOKEN;if(t)api('hrms_logout',{p_token:t}).catch(()=>{});signedOut('')},
 theme:()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';r.dataset.theme=n;store.set(KEY+'-theme',n);render()},
 close,
 dept:v=>{UI.dept=v;render()},
 poff:v=>{UI.payOff=Number(v);render()},
 in:()=>run('hrms_checkin',T({}),()=>'Checked in at '+tm(nowMin())+(nowMin()>LATE?' (late mark)':'')),
 brk:()=>run('hrms_state',T({p_kind:'break',p_at:null}),'Break started'),
 resume:()=>run('hrms_state',T({p_kind:'work',p_at:null}),'Back to work'),
 out:()=>open('Check out for today?',`<p>Your active time today is <b>${hm(tsum(S.gen.today[ME]).work)}</b>${tsum(S.gen.today[ME]).work<SHIFT?', which is less than the 8h shift':''}.</p><div class="acts"><button class="btn no" data-a="outOk">Check out</button><button class="btn" data-a="close">Keep working</button></div>`),
 outOk:()=>run('hrms_checkout',T({}),'Checked out. See you tomorrow.',close),
 tst:v=>{const [id,st]=v.split('|');run('hrms_task_status',T({p_id:Number(id),p_st:st}),st==='done'?'Task marked done':'Task updated')},
 task:v=>{const t=S.tasks.find(x=>String(x.id)===v)||{title:'',desc:'',to:'',due:addDays(TK,1),pri:'Medium'};const r=role();const list=(r==='admin'||r==='hr')?S.emps:S.emps.filter(e=>e.mgr===ME||e.id===ME);
  open(v?'Edit task':'Assign a task',`<form id="fTask" class="form" data-id="${esc(v||'')}"><label class="w">Task<input name="title" required maxlength="100" value="${esc(t.title)}"></label><label class="w">Details<textarea name="desc" maxlength="300">${esc(t.desc)}</textarea></label>
  <label>Assign to<select name="to" required>${empOpts(list,t.to)}</select></label><label>Due date<input type="date" name="due" required value="${t.due}"></label><label>Priority<select name="pri">${['High','Medium','Low'].map(p=>`<option${p===t.pri?' selected':''}>${p}</option>`).join('')}</select></label>
  <div class="w acts"><button class="btn p">${v?'Save changes':'Assign task'}</button>${v?`<button type="button" class="btn no" data-a="tdel" data-v="${esc(v)}">Delete</button>`:''}</div></form>`)},
 tdel:v=>run('hrms_delete_task',T({p_id:Number(v)}),'Task deleted',close),
 lv:v=>{const [id,st]=v.split('|');run('hrms_decide_leave',T({p_id:Number(id),p_st:st}),'Leave '+st)},
 tgt:v=>{const t=tgt(v);open('Monthly target · '+esc(emp(v).name),`<form id="fTgt" class="form" data-id="${v}"><label>Calls<input type="number" name="calls" min="0" required value="${t.calls}"></label><label>Talk time (minutes)<input type="number" name="talk" min="0" required value="${t.talk}"></label><label>Bookings<input type="number" name="conv" min="0" required value="${t.conv}"></label><label>Revenue (₹)<input type="number" name="rev" min="0" step="1000" required value="${t.rev}"></label><p class="note w" style="margin:0">Daily call target = monthly calls ÷ 26 working days.</p><div class="w"><button class="btn p">Save target</button></div></form>`)},
 slip:v=>open('Payslip',slip(emp(v),pay(emp(v),UI.payOff))),
 adj:v=>{const p=pay(emp(v),UI.payOff);open('Adjust pay · '+esc(emp(v).name),`<form id="fAdj" class="form" data-id="${v}" data-ym="${p.ym}"><label>Type<select name="kind"><option value="-1">Deduction</option><option value="1">Bonus / incentive</option></select></label><label>Amount (₹)<input type="number" name="amt" min="1" required></label><label class="w">Reason<input name="reason" required maxlength="80" placeholder="e.g. Laptop damage recovery, or booking incentive"></label><p class="note w" style="margin:0">Applies to ${p.label}.${p.adj.length?'':' No adjustments yet.'}</p>${p.adj.length?`<div class="w">${p.adj.map(a=>`<div class="meta" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(a.reason)} · <b>${a.amt<0?'−':'+'}${rup(Math.abs(a.amt))}</b></span>${isAdm()?`<button type="button" class="btn s no" data-a="adjDel" data-v="${a.id}">Delete</button>`:''}</div>`).join('')}</div>`:''}<div class="w"><button class="btn p">Add adjustment</button></div></form>`)},
 rp:v=>{const e=emp(v),p=pay(e,UI.payOff);open('Pay salary through Razorpay',`<div class="meta" style="justify-content:space-between;margin-bottom:12px">${person(e,e.title)}<span class="chip c-none">${p.label}</span></div><table class="slip"><tbody><tr><td>Net pay</td><td><b>${rup(p.net)}</b></td></tr><tr><td>Send to</td><td>${esc(e.bank||'No account')}</td></tr><tr><td>Mode</td><td>${/^UPI/.test(e.bank||'')?'UPI':'IMPS'}</td></tr><tr><td>From</td><td>${esc(S.rzp.acct)}</td></tr><tr><td>Balance after</td><td>${rup(S.rzp.balance-p.net)}</td></tr></tbody></table><div class="acts" style="margin-top:14px"><button class="btn p" data-a="rpGo" data-v="${e.id}">Pay ${rup(p.net)}</button><button class="btn" data-a="close">Cancel</button></div><p class="note">Test mode: no real money moves.</p>`)},
 rpGo:v=>{const e=emp(v),p=pay(e,UI.payOff);run('hrms_pay',T({p_items:[{emp:e.id,ym:p.ym,label:p.label,amt:p.net}]}),n=>n?'Payout started for '+e.name:'Nothing to pay',()=>{close();setTimeout(()=>load().then(()=>{if(!editing())render()}).catch(()=>{}),3600)})},
 rpAll:()=>{const list=S.emps.map(e=>({e,p:pay(e,UI.payOff)})).filter(x=>!x.p.po&&x.p.net>0),tot=sum(list,x=>x.p.net);open('Pay '+list.length+' salaries',`<div class="scroll" style="max-height:300px;overflow-y:auto"><table class="slip"><tbody>${list.map(x=>`<tr><td>${esc(x.e.name)}<br><small style="color:var(--mute)">${esc(x.e.bank||'')}</small></td><td>${rup(x.p.net)}</td></tr>`).join('')}<tr class="t"><td>Total</td><td>${rup(tot)}</td></tr></tbody></table></div><p class="note">From ${esc(S.rzp.acct)} · balance after ${rup(S.rzp.balance-tot)}.</p><div class="acts" style="margin-top:12px"><button class="btn p" data-a="rpAllGo">Pay ${rup(tot)} through Razorpay</button><button class="btn" data-a="close">Cancel</button></div>`)},
 rpAllGo:()=>{const items=S.emps.map(e=>({e,p:pay(e,UI.payOff)})).filter(x=>!x.p.po&&x.p.net>0).map(x=>({emp:x.e.id,ym:x.p.ym,label:x.p.label,amt:x.p.net}));run('hrms_pay',T({p_items:items}),n=>n+' payouts started',()=>{close();setTimeout(()=>load().then(()=>{if(!editing())render()}).catch(()=>{}),3600)})},
 inc:()=>open('Sales incentive',`<form id="fInc" class="form"><label class="w">Incentive (% of monthly booking revenue)<input type="number" name="inc" min="0" max="20" step="0.5" required value="${S.inc}"></label><p class="note w" style="margin:0">Applies to every sales executive’s payslip, from bookings logged in Sales &amp; calls. Paid months are not changed.</p><div class="w"><button class="btn p">Save</button></div></form>`),
 more:()=>{const pend=S.leaves.filter(l=>l.st==='pending'&&canApprove(l)).length,unread=S.notes.filter(n=>n.to===ME&&!n.read).length,dk=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  open('Menu',`<div class="meta" style="margin-bottom:14px">${person(me(),{admin:'Admin',hr:'HR',manager:'Sales manager',sales:'Sales executive',ops:'Employee'}[role()])}</div><div class="more">${NAV.filter(n=>n[2].includes(role())).map(n=>`<button class="${UI.view===n[0]?'on':''}" data-a="mgo" data-v="${n[0]}"><svg viewBox="0 0 24 24"><path d="${IC[n[0]]}"/></svg>${n[1]}${n[0]==='leaves'&&pend?`<span class="cnt">${pend}</span>`:''}${n[0]==='notes'&&unread?`<span class="cnt">${unread}</span>`:''}</button>`).join('')}</div><div class="acts" style="margin-top:16px"><button class="btn" data-a="mpw">Change password</button><button class="btn" data-a="mtheme">${dk?'Light mode':'Dark mode'}</button><button class="btn no" data-a="mlogout">Sign out</button></div>`)},
 mgo:v=>{close();A.go(v)},
 mtheme:()=>{close();A.theme()},
 mlogout:()=>{close();A.logout()},
 readAll:()=>run('hrms_read',T({p_id:null})),
 openNote:v=>{const n=S.notes.find(x=>String(x.id)===v);if(!n)return;if(!n.read){n.read=true;api('hrms_read',T({p_id:Number(v)})).catch(()=>{})}A.go(allowed(n.view)?n.view:'dash')},
 emp:v=>{const e=emp(v),rec=S.gen.today[v],t=tsum(rec);const ds=[];for(let k=addDays(TK,-1);ds.length<6;k=addDays(k,-1))if(!isSun(k))ds.unshift(k);
  open(esc(e.name),`<div class="meta" style="justify-content:space-between;margin-bottom:12px">${person(e,e.title+' · '+e.dept)}${chip(status(v))}</div>${tl(rec)}${ticks}<div class="stack3" style="margin:12px 0"><div><span>Active</span><b>${hm(t.work)}</b></div><div><span>Break</span><b>${hm(t.break)}</b></div><div><span>Idle</span><b>${hm(t.idle)}</b></div></div>
  <h3 style="margin:14px 0 6px">Last 6 working days</h3><table><thead><tr><th>Day</th><th class="n">In</th><th class="n">Active</th>${e.role==='sales'?'<th class="n">Calls</th>':''}</tr></thead><tbody>${ds.map(k=>{const a=attFor(v,k);return `<tr><td>${fdate(k)}</td><td class="n">${a.st==='present'?tm(a.in)+(a.late?' · late':''):a.st==='pre'?'–':a.st}</td><td class="n">${a.act!=null?hm(a.act):'–'}</td>${e.role==='sales'?`<td class="n">${dayStats(v,k).calls}</td>`:''}</tr>`}).join('')}</tbody></table>
  <p class="note">Phone: ${esc(e.phone||'')}</p>`)},
 addEmp:()=>open('Add employee',`<form id="fEmp" class="form"><label class="w">Login password<input name="pw" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><p class="note w" style="margin:0">The employee ID is given automatically. Share the ID and password with the person privately.</p><label class="w">Full name<input name="name" required maxlength="60"></label><label>Login role<select name="role"><option value="sales">Sales executive</option><option value="ops">Employee (operations)</option><option value="manager">Sales manager</option><option value="hr">HR</option>${isAdm()?'<option value="admin">Admin</option>':''}</select></label><label>Department<input name="dept" required value="Sales" maxlength="40"></label>
  <label>Job title<input name="title" required maxlength="50" value="Sales Executive"></label><label>Monthly gross (₹)<input type="number" name="salary" min="1000" required value="25000"></label><label>Reports to<select name="mgr">${empOpts(S.emps.filter(e=>['admin','hr','manager'].includes(e.role)),'E03')}</select></label><label>Phone<input name="phone" inputmode="tel" maxlength="15"></label><label class="w">Salary account (bank ••last 4, or UPI ID)<input name="bank" required maxlength="40" placeholder="e.g. SBI ••1234 or UPI name@okaxis"></label><label class="w">Password<input name="pw" required minlength="6" value="emp123"></label><div class="w"><button class="btn p">Add employee</button></div></form>`)
 ,pw:()=>open('Change password',`<form id="fPw" class="form"><label class="w">Current password<input type="password" name="old" required autocomplete="current-password"></label><label class="w">New password<input type="password" name="nw" required minlength="6" autocomplete="new-password"></label><label class="w">Repeat new password<input type="password" name="nw2" required minlength="6" autocomplete="new-password"></label><p class="note w" style="margin:0">You stay signed in here. Other devices are signed out.</p><div class="w"><button class="btn p">Save password</button></div></form>`),
 mpw:()=>{close();A.pw()},
 rpw:v=>open('Reset password · '+esc(emp(v).name),`<form id="fRpw" class="form" data-id="${esc(v)}"><label class="w">New password<input name="nw" required minlength="6" autocomplete="off"></label><p class="note w" style="margin:0">They are signed out everywhere and get a notification. Share the new password with them privately.</p><div class="w"><button class="btn p">Reset password</button></div></form>`),
 empEdit:v=>{const e=emp(v),R={sales:'Sales executive',ops:'Employee (operations)',manager:'Sales manager',hr:'HR',admin:'Admin'};
  open('Edit employee · '+esc(e.id),`<form id="fEditEmp" class="form" data-id="${esc(v)}"><label>Employee ID (login)<input value="${esc(e.id)}" disabled></label><label>New password<input name="pw" type="text" minlength="6" autocomplete="new-password" placeholder="Leave blank to keep the current one"></label>
  <label class="w">Full name<input name="name" required maxlength="60" value="${esc(e.name)}"></label><label>Login role<select name="role">${Object.keys(R).map(r=>`<option value="${r}"${r===e.role?' selected':''}>${R[r]}</option>`).join('')}</select></label><label>Department<input name="dept" maxlength="40" value="${esc(e.dept)}"></label>
  <label>Job title<input name="title" maxlength="50" value="${esc(e.title)}"></label><label>Monthly gross (₹)<input type="number" name="salary" min="0" required value="${e.salary||0}"></label>
  <label>Reports to<select name="mgr"><option value="">No one</option>${empOpts(S.emps.filter(x=>x.id!==e.id&&['admin','hr','manager'].includes(x.role)),e.mgr)}</select></label><label>Phone<input name="phone" inputmode="tel" maxlength="15" value="${esc(e.phone||'')}"></label>
  <label class="w">Salary account (bank ••last 4, or UPI ID)<input name="bank" maxlength="40" value="${esc(e.bank||'')}"></label>
  <p class="note w" style="margin:0">A new password signs them out on their other devices. Share it with them privately.</p><div class="w acts"><button class="btn p">Save changes</button>${e.id!==ME?`<button type="button" class="btn no" data-a="rm" data-v="${esc(v)}">Delete employee</button>`:''}</div></form>`)},
 tdelAsk:v=>{const t=S.tasks.find(x=>String(x.id)===v);if(t)yes('Delete this task?',`“${esc(t.title)}” for ${esc(emp(t.to).name)} will be removed for everyone.`,'tdel',v)},
 lvEdit:v=>{const l=S.leaves.find(x=>String(x.id)===v);if(!l)return;open('Edit leave · '+esc(emp(l.emp).name),`<form id="fLvEdit" class="form" data-id="${esc(v)}"><label>Type<select name="type">${Object.keys(QUOTA).map(k=>`<option${k===l.type?' selected':''}>${k}</option>`).join('')}</select></label><label>Status<select name="st">${['pending','approved','rejected'].map(k=>`<option value="${k}"${k===l.st?' selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select></label>
  <label>From<input type="date" name="from" required value="${l.from}"></label><label>To<input type="date" name="to" required value="${l.to}"></label><label class="w">Reason<textarea name="reason" maxlength="200">${esc(l.reason)}</textarea></label><div class="w"><button class="btn p">Save changes</button></div></form>`)},
 lvDel:v=>{const l=S.leaves.find(x=>String(x.id)===v);if(l)yes('Delete this leave request?',`${esc(emp(l.emp).name)} · ${l.type} · ${fdate(l.from)}${l.to!==l.from?' to '+fdate(l.to):''}. If it was approved, those days count as absent again.`,'lvDelOk',v)},
 lvDelOk:v=>run('hrms_delete_leave',T({p_id:Number(v)}),'Leave deleted',close),
 callEdit:v=>{const c=findCall(v);if(!c)return;open('Edit call · '+esc(emp(c.emp).name),`<form id="fCallEdit" class="form" data-id="${esc(v)}"><label>Customer name<input name="lead" required maxlength="60" value="${esc(c.lead)}"></label><label>Phone<input name="phone" maxlength="15" value="${esc(c.phone)}"></label>
  <label>Outcome<select name="out">${OUTS.map(o=>`<option${o===c.out?' selected':''}>${o}</option>`).join('')}</select></label><label>Call length (minutes)<input name="dur" type="number" min="0" max="120" step="0.5" value="${Math.round(c.dur/30)/2}"></label>
  <label>Booking value (₹)<input name="rev" type="number" min="0" step="500" value="${c.rev}"></label><label>Enquiry<select name="note">${[...new Set([c.note,...NEEDS])].filter(Boolean).map(n=>`<option${n===c.note?' selected':''}>${esc(n)}</option>`).join('')}</select></label><div class="w"><button class="btn p">Save changes</button></div></form>`)},
 callDel:v=>{const c=findCall(v);if(c)yes('Delete this call?',`${esc(c.lead)} · ${esc(c.out)} · logged by ${esc(emp(c.emp).name)}. It is removed from their call count${c.rev?' and booking revenue':''}.`,'callDelOk',v)},
 callDelOk:v=>run('hrms_delete_call',T({p_id:Number(v)}),'Call deleted',close),
 dayEdit:v=>{const k=UI.attDate||TK,a=attFor(v,k),e=emp(v),has=a.st==='present';
  open((has?'Edit':'Add')+' attendance · '+esc(e.name),`<form id="fDay" class="form" data-id="${esc(v)}" data-day="${k}"><p class="note w" style="margin:0">${fdate(k)} · India time</p><label>Check-in<input type="time" name="in" required value="${has?hhmm(a.in):'09:30'}"></label><label>Check-out<input type="time" name="out" ${k<TK?'required':''} value="${has?hhmm(a.out):(k<TK?'18:30':'')}"></label>
  <label>Break (minutes)<input type="number" name="brk" min="0" max="600" value="${has?Math.round(a.brk||0):45}"></label><label>Idle (minutes)<input type="number" name="idle" min="0" max="600" value="${has?Math.round(a.idle||0):0}"></label>
  <p class="note w" style="margin:0">${k===TK?'Leave check-out empty if they are still working. ':''}Active time = check-out − check-in − break − idle. They get a notification.</p><div class="w"><button class="btn p">Save attendance</button></div></form>`)},
 dayDel:v=>yes('Delete attendance?',`${esc(emp(v).name)} · ${fdate(UI.attDate||TK)}. The day will show as absent (loss of pay) unless leave is approved.`,'dayDelOk',v),
 dayDelOk:v=>run('hrms_delete_day',T({p_emp:v,p_day:UI.attDate||TK}),'Attendance deleted',close),
 adjDel:v=>run('hrms_delete_adj',T({p_id:Number(v)}),'Adjustment removed',close),
 poDel:v=>{const p=S.payouts.find(x=>x.id===v);if(p)yes('Cancel this payout record?',`${esc(emp(p.emp).name)} · ${esc(p.label)} · ${rup(p.amt)}. Test mode: the amount goes back to the RazorpayX balance and the month shows as pending again.`,'poDelOk',v,'Cancel payout')},
 poDelOk:v=>run('hrms_delete_payout',T({p_id:v}),'Payout cancelled',close),
 rm:v=>yes('Delete '+esc(emp(v).name)+'?','They can no longer sign in, and they leave the live monitor, payroll and team lists. Their past attendance, calls and payouts stay on record.','rmOk',v),
 rmOk:v=>run('hrms_remove_employee',T({p_emp:v}),'Deleted '+emp(v).name,close)
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){e.preventDefault();const f=A[b.dataset.a];if(f)f(b.dataset.v,b)}else if(e.target.id==='mask')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;UI[c]=e.target.value;render()});

const F={
 fLogin:async d=>{const id=String(d.get("uid")).trim().toUpperCase(),pw=String(d.get('pw'));const b=$('#fLogin button'),er=$('#lerr');b.disabled=true;b.textContent='Signing in…';er.textContent='';
  try{const r=await api('hrms_login',{p_id:id,p_pw:pw});TOKEN=r.token;store.set(TOKEN_KEY,TOKEN);await load();UI.lmsg='';UI.view=['sales','ops'].includes(r.role)?'me':'dash';try{history.replaceState(null,'','#'+UI.view)}catch(e){}render();toast('Signed in as '+r.name)}
  catch(e){b.disabled=false;b.textContent='Sign in';er.textContent=e.message}},
 fLeave:d=>{const from=d.get('from'),to=d.get('to');if(to<from){toast('End date is before start date');return}
  run('hrms_apply_leave',T({p_type:d.get('type'),p_from:from,p_to:to,p_reason:String(d.get('reason')).trim()}),role()==='admin'?'Leave recorded':'Leave request sent')},
 fCall:(d,f)=>{const out=d.get('out'),dur=out==='No answer'?0:Math.round(Number(d.get('dur'))*60);
  run('hrms_log_call',T({p_lead:String(d.get('lead')).trim(),p_phone:String(d.get('phone')).trim(),p_out:out,p_dur:dur,p_rev:out==='Converted'?Number(d.get('rev'))||0:0,p_note:d.get('note')}),out==='Converted'?'Booking saved. It counts toward your target and incentive.':'Call saved')},
 fTask:(d,f)=>{const v=f.dataset.id;run('hrms_save_task',T({p_id:v?Number(v):null,p_title:String(d.get('title')).trim(),p_desc:String(d.get('desc')).trim(),p_to:d.get('to'),p_due:d.get('due'),p_pri:d.get('pri')}),v?'Task updated':'Task assigned to '+emp(d.get('to')).name,close)},
 fInc:d=>run('hrms_set_inc',T({p_inc:Math.max(0,Number(d.get('inc'))||0)}),'Incentive updated',close),
 fTgt:(d,f)=>run('hrms_set_target',T({p_emp:f.dataset.id,p_calls:+d.get('calls'),p_talk:+d.get('talk'),p_conv:+d.get('conv'),p_rev:+d.get('rev')}),'Target saved',close),
 fAdj:(d,f)=>run('hrms_add_adj',T({p_emp:f.dataset.id,p_ym:f.dataset.ym,p_amt:Number(d.get('kind'))*Math.abs(Number(d.get('amt'))),p_reason:String(d.get('reason')).trim()}),'Adjustment added',close),
 fEmp:d=>run('hrms_add_employee',T({p_name:String(d.get('name')).trim(),p_role:d.get('role'),p_dept:String(d.get('dept')).trim(),p_title:String(d.get('title')).trim(),p_salary:Number(d.get('salary')),p_mgr:d.get('mgr')||'',p_phone:String(d.get('phone')||'').trim(),p_bank:String(d.get('bank')||'').trim(),p_pw:String(d.get('pw'))}),id=>'Added '+id+'. They can sign in with that ID now.',close),
 fPw:d=>{if(d.get('nw')!==d.get('nw2')){toast('The new passwords do not match');return}run('hrms_change_password',T({p_old:String(d.get('old')),p_new:String(d.get('nw'))}),'Password changed',close)},
 fRpw:(d,f)=>run('hrms_reset_password',T({p_emp:f.dataset.id,p_new:String(d.get('nw'))}),'Password reset for '+emp(f.dataset.id).name,close),
 fEditEmp:(d,f)=>run('hrms_update_employee',T({p_emp:f.dataset.id,p_name:String(d.get('name')).trim(),p_role:d.get('role'),p_dept:String(d.get('dept')).trim(),p_title:String(d.get('title')).trim(),p_salary:Number(d.get('salary'))||0,p_mgr:d.get('mgr')||'',p_phone:String(d.get('phone')||'').trim(),p_bank:String(d.get('bank')||'').trim(),p_pw:String(d.get('pw')||'')}),d.get('pw')?'Saved, with the new password':'Employee updated',close),
 fLvEdit:(d,f)=>{if(d.get('to')<d.get('from')){toast('End date is before start date');return}run('hrms_update_leave',T({p_id:Number(f.dataset.id),p_type:d.get('type'),p_from:d.get('from'),p_to:d.get('to'),p_reason:String(d.get('reason')).trim(),p_st:d.get('st')}),'Leave updated',close)},
 fCallEdit:(d,f)=>run('hrms_update_call',T({p_id:Number(f.dataset.id),p_lead:String(d.get('lead')).trim(),p_phone:String(d.get('phone')).trim(),p_out:d.get('out'),p_dur:Math.round(Number(d.get('dur'))*60),p_rev:Number(d.get('rev'))||0,p_note:d.get('note')}),'Call updated',close),
 fDay:(d,f)=>run('hrms_set_day',T({p_emp:f.dataset.id,p_day:f.dataset.day,p_in:d.get('in'),p_out:d.get('out')||'',p_brk:Number(d.get('brk'))||0,p_idle:Number(d.get('idle'))||0}),'Attendance saved',close)
};
